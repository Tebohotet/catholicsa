name: Claude Code

# On-demand path: mention @claude in any issue or PR comment (or a PR
# review comment) and Claude responds - implements what you asked,
# answers questions, pushes commits to that PR. This is the "ask it to
# do something right now" half of the setup; claude-daily-coding.yml
# (below) is the "keep working while I'm away" half.
"on":
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # If you authenticate with a Claude subscription instead of an
          # API key, delete the line above and use this one instead:
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
