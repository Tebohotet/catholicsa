name: Build and Deploy

# Runs on every push to main or develop - analyze and test first, only
# deploy if both pass. A broken build should never reach production
# because the deploy step ran regardless of what came before it.
#
# Two environments, same code, different Firebase project:
#   push to main    -> production (catholicsa-61b87), secret FIREBASE_SERVICE_ACCOUNT
#   push to develop -> staging    (catholicsa-dev),   secret FIREBASE_SERVICE_ACCOUNT_DEV
# The web build is told which one it is via --dart-define=APP_ENV (see
# lib/config/app_environment.dart), so the staging site talks only to the
# dev project's Firestore/Auth/Storage - no shared data with production.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build_and_test:
    name: Analyze, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      # Staging builds need the dev project's generated client config.
      # Fail loudly here rather than deploy a site that crashes on load.
      - name: Check staging Firebase config exists
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: |
          if grep -q "PLACEHOLDER - NOT YET GENERATED" lib/firebase_options_dev.dart; then
            echo "::error::lib/firebase_options_dev.dart is still the placeholder. Run 'flutterfire configure --project=catholicsa-dev --out=lib/firebase_options_dev.dart' and commit the result."
            exit 1
          fi

      - name: Build web
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ] && [ "${{ github.event_name }}" = "push" ]; then
            flutter build web --release --dart-define=APP_ENV=staging
          else
            flutter build web --release
          fi

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 1

  deploy:
    name: Deploy to Firebase (${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }})
    needs: build_and_test
    # Only deploys on an actual push to main/develop, never on a pull
    # request - a PR only needs the build/test job above to pass for review.
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT: ${{ github.ref == 'refs/heads/main' && 'catholicsa-61b87' || 'catholicsa-dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Set up Node.js (for firebase-tools and Cloud Functions)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci

      # Current recommended auth method - FIREBASE_TOKEN (firebase
      # login:ci) is deprecated. This uses a service account key stored
      # as a GitHub secret instead. See the setup note below for how to
      # create it - this is a real prerequisite step that has to happen
      # in your GCP/GitHub settings, not something this file can do on
      # its own.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          #
          # Each project has its own deploy service account + secret, so
          # a leaked/misused staging key can never touch production.
          credentials_json: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting,functions,firestore:rules,firestore:indexes,storage --project "$FIREBASE_PROJECT" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
