name: Build and Deploy

# Runs on every push to main - analyze and test first, only deploy if
# both pass. A broken build should never reach production because the
# deploy step ran regardless of what came before it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_and_test:
    name: Analyze, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 1

  deploy:
    name: Deploy to Firebase
    needs: build_and_test
    # Only deploys on an actual push to main, never on a pull request -
    # a PR only needs the build/test job above to pass for review.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Set up Node.js (for firebase-tools and Cloud Functions)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci

      # Current recommended auth method - FIREBASE_TOKEN (firebase
      # login:ci) is deprecated. This uses a service account key stored
      # as a GitHub secret instead. See the setup note below for how to
      # create it - this is a real prerequisite step that has to happen
      # in your GCP/GitHub settings, not something this file can do on
      # its own.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting,functions,firestore:rules,firestore:indexes --project catholicsa-61b87 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}