name: catholicsa
description: Catholic parish directory and community app for South Africa
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3

  # Auth
  google_sign_in: ^6.2.1
  # Windows-only fallback for the above - google_sign_in has no Windows
  # implementation at all (confirmed from the Flutter team). See
  # lib/config/google_desktop_oauth_config.dart for the one-time Google
  # Cloud Console setup this needs.
  #
  # Pinned to the 1.x line deliberately, not latest (2.x): starting at
  # 2.0.0 this package's mobile implementation requires
  # google_sign_in ^7.1.1, which conflicts with google_sign_in ^6.2.1
  # above (confirmed via pub.dev - no version of google_sign_in
  # satisfies both ^6.2.1 and ^7.1.1 at once), and that's what was
  # actually causing `flutter pub get` to fail with exit code 1 once
  # CI could finally run. The package's own migration guide confirms
  # the GoogleSignIn/GoogleSignInParams API used in
  # signInWithGoogleWindows() (auth_service.dart) is unchanged going
  # into 2.0.0, so staying on 1.x costs nothing functionally - it just
  # avoids the forced google_sign_in v7 upgrade, which would otherwise
  # require rewriting signInWithGoogle() too (v7 is a breaking rewrite
  # of google_sign_in itself, unrelated to this package).
  google_sign_in_all_platforms: ^1.2.1

  # Routing
  go_router: ^14.3.0

  # State management
  flutter_riverpod: ^2.6.1

  # Location / maps
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  audioplayers: ^6.1.0
  http: ^1.2.2
  xml: ^6.5.0
  archive: ^4.0.2
  path: ^1.9.0
  path_provider: ^2.1.4
  share_plus: ^10.1.3
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  shared_preferences: ^2.3.2

  # Payments (PayFast is form/redirect-based, no official SDK — handled via
  # webview redirect + Cloud Function to generate the signed payment request)
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/bible/
    - assets/hymns/